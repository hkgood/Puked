name: Puked APK Build

# 普通 push 到 main 时只上传 artifact；创建 Release 请推送 tag（见 puked-release.yml）
on:
  push:
    branches: [main]
    paths:
      - 'Puked/**'
      - '.github/workflows/puked-apk-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Puked/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd Puked
          flutter pub get

      - name: Build Runner
        run: |
          cd Puked
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Static Analysis
        run: |
          cd Puked
          flutter analyze --fatal-infos --fatal-warnings

      - name: Build APK
        run: |
          cd Puked
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puked-release-apk
          path: Puked/build/app/outputs/flutter-apk/app-release.apk

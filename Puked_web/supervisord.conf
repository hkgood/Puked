[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock

[unix_http_server]
file=/var/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
priority=10

[program:task-processor]
command=node /app/processor/task_processor.pb.js
directory=/app/processor
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/var/log/supervisor/task_processor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/task_processor_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
redirect_stderr=false
environment=NODE_ENV="production",PB_URL="https://pb.osglab.com",ADMIN_EMAIL="rocky.hk@gmail.com",ADMIN_PASSWORD="gz203799",CHECK_INTERVAL="60000",HEARTBEAT_INTERVAL="300000",BATCH_SIZE="10",CONCURRENCY="3"
priority=20
stopwaitsecs=30
killasgroup=true
stopasgroup=true

# ============================================
# Puked.osglab.com 主配置文件
# 路径：/etc/nginx/conf.d/puked.osglab.com.conf
# 或你原来配置文件的位置
# ============================================

server {
    listen 80;
    listen 443 ssl;
    server_name puked.osglab.com;
    
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/puked.osglab.com/log/access.log main;
    error_log /www/sites/puked.osglab.com/log/error.log warn;
    
    root /www/sites/puked.osglab.com/index;
    
    # ========== 🆕 客户端缓冲区优化（修复 HTTP/2 错误） ==========
    client_body_buffer_size 256k;
    client_max_body_size 50m;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 128k;
    
    # ========== 🆕 HTTP/2 优化配置 ==========
    http2 on;
    http2_max_field_size 128k;
    http2_max_header_size 128k;
    http2_max_requests 1000;
    
    # ========== 安全路径限制（保持不变） ==========
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    
    # ========== SSL 重定向（保持不变） ==========
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    
    # ========== SSL 证书配置（保持不变） ==========
    ssl_certificate /www/sites/puked.osglab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/puked.osglab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    error_page 497 https://$host$request_uri;
    
    # ========== 🆕 安全头（优化） ==========
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ========== ❌ 移除这些（应该在 location 块中） ==========
    # proxy_set_header X-Forwarded-Proto https;
    # proxy_buffer_size 128k;
    # proxy_buffers 4 256k;
    # proxy_busy_buffers_size 256k;
    # proxy_set_header Host $host;
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;
    
    # ========== 引入代理配置（保持不变） ==========
    include /www/sites/puked.osglab.com/proxy/*.conf;
}

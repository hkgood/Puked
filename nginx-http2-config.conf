# ============================================================
# HTTP/2 优化配置
# 将这些内容添加到 /etc/nginx/nginx.conf 的 http {} 块中
# ============================================================

http {
    # ... 原有配置 ...
    
    # ============================================================
    # 🚀 HTTP/2 性能优化
    # ============================================================
    http2_max_concurrent_streams 256;        # 提升并发流数量（默认 128）
    http2_max_requests 10000;                # 增加单连接最大请求数
    http2_max_header_size 128k;              # 最大请求头大小
    
    # ============================================================
    # 🖼️ Nginx 服务器端缓存（可选，性能提升 30-50%）
    # ============================================================
    # 定义缓存路径
    proxy_cache_path /var/cache/nginx/pocketbase
                     levels=1:2
                     keys_zone=pocketbase_cache:100m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;
    
    # ... 原有配置 ...
}

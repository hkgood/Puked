name: Build and Push Puked Web

on:
  push:
    branches:
      - main
    paths:
      - 'Puked_web/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: |
          VERSION=$(grep '"version"' Puked_web/package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Image version: $VERSION"

      - name: Build and Push (Multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./Puked_web
          file: ./Puked_web/Dockerfile.allinone.v2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            rocky8848/puked-web:${{ env.VERSION }}
            rocky8848/puked-web:latest
            ghcr.io/hkgood/puked-web:${{ env.VERSION }}
            ghcr.io/hkgood/puked-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
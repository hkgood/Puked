version: '3.8'

services:
  # 仅部署任务处理器
  task-processor:
    build:
      context: ./Puked_web/scripts
      dockerfile: Dockerfile.task-processor
    container_name: puked-task-processor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SERVER_MODE=false  # 通过 HTTP API 访问 PocketBase
      - PB_URL=http://pb.osglab.com  # 云端 PocketBase 地址
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - CHECK_INTERVAL=10000
      - BATCH_SIZE=10
      - CONCURRENCY=3
    # 注意：不需要挂载 pb_data，通过 HTTP API 访问
    networks:
      - puked-network
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  puked-network:
    driver: bridge

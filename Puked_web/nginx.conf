server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 🆕 增大缓冲区以支持大型 JS 文件（修复 HTTP/2 错误）
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 32k;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 🆕 P2 修复：添加 Brotli 压缩（比 Gzip 压缩率更高）
    brotli on;
    brotli_vary on;
    brotli_proxied any;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    brotli_min_length 1000;

    # 🆕 禁用 sendfile 可能导致的 HTTP/2 问题
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    # 🆕 禁用范围请求（修复图片 HTTP/2 错误）
    max_ranges 0;

    # 🔥 P2 修复：预加载关键资源 hints（减少请求等待时间）
    # 预加载首屏关键 JS
    location ~* \.js$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "none";
        # Preload 提示（实际生效需要后端在 HTML 里加 <link rel="preload">）
        add_header Link '</$uri>; rel="preload"; as="script"';
    }

    # 预加载关键 CSS
    location ~* \.css$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "none";
        add_header Link '</$uri>; rel="preload"; as="style"';
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 🆕 静态资源缓存 - 更细粒度的控制
    location ~* \.(js|mjs)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "none";
    }

    location ~* \.(css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "none";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges "none";
        # 🔥 P2 修复：预加载图片资源
        add_header Link '</$uri>; rel="preload"; as="image"';
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges "none";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 🆕 禁用不必要的日志以提升性能
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

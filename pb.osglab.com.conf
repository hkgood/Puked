# ============================================
# PocketBase (pb.osglab.com) 主配置文件
# 优化版本 - 修复 HTTP/2 错误 + 性能提升
# ============================================

server {
    listen 80;
    listen 443 ssl;
    server_name pb.osglab.com;
    
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/pb.osglab.com/log/access.log main;
    error_log /www/sites/pb.osglab.com/log/error.log warn;
    
    root /www/sites/pb.osglab.com/index;
    
    # ========== 🆕 客户端缓冲区优化（修复 HTTP/2 错误） ==========
    client_body_buffer_size 256k;
    client_max_body_size 100m;  # PocketBase 可能需要上传大文件
    client_header_buffer_size 32k;
    large_client_header_buffers 4 128k;
    
    # ========== 🆕 HTTP/2 优化配置 ==========
    http2 on;
    http2_max_field_size 128k;
    http2_max_header_size 128k;
    http2_max_requests 1000;
    
    # ========== 🆕 禁用范围请求（修复图片 HTTP/2 错误） ==========
    max_ranges 0;
    
    # ========== 安全路径限制（保持不变） ==========
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    
    # ========== SSL 重定向（保持不变） ==========
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    
    # ========== SSL 证书配置（保持不变） ==========
    ssl_certificate /www/sites/pb.osglab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/pb.osglab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    error_page 497 https://$host$request_uri;
    
    # ========== 安全头（保持不变） ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # ========== 🖼️ 图片文件缓存优化（增强） ==========
    location ~ ^/api/files/ {
        proxy_pass http://127.0.0.1:8090;
        
        # 🆕 使用 HTTP/1.1（禁用到后端的 HTTP/2）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 🆕 禁用范围请求（修复图片 HTTP/2 错误）
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_ignore_headers X-Accel-Buffering;
        
        # 转发真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置（增加到 300s 以支持大文件）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 🆕 缓冲配置（增大以支持大图片）
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
        
        # 缓存配置（图片缓存 1 小时）
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache-Status $upstream_cache_status;
        
        # 🆕 禁用范围请求支持
        add_header Accept-Ranges "none";
    }
    
    # ========== 📡 Realtime 连接优化（SSE 长连接）（保持不变） ==========
    location /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        
        # 禁用缓冲（SSE 必需）
        proxy_buffering off;
        proxy_cache off;
        
        # 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 增加超时时间（SSE 是长连接）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # 转发真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 必需的响应头
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # ========== 🌐 其他 API 请求（通用反向代理）（增强） ==========
    location / {
        proxy_pass http://127.0.0.1:8090;
        
        # 🆕 使用 HTTP/1.1（禁用到后端的 HTTP/2）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        
        # 转发真实 IP 和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 🆕 超时配置（增加以支持长时间操作）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 🆕 缓冲配置（增大）
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }
}

# ============================================
# Puked Web App 反向代理配置
# 路径：/www/sites/puked.osglab.com/proxy/puked-web.conf
# ============================================

# ========== 主应用路由（/ 开头的所有请求） ==========
location / {
    # 🔧 代理到 Docker 容器（端口 3001）
    proxy_pass http://127.0.0.1:3001;
    
    # 🔧 使用 HTTP/1.1（关键！禁用到后端的 HTTP/2）
    proxy_http_version 1.1;
    
    # 🔧 超时配置（防止大文件传输超时）
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # 🔧 缓冲区配置（修复 HTTP/2 错误的核心）
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;
    
    # 🔧 请求头传递
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # 🔧 WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # 🔧 禁用代理缓存（确保实时数据）
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# ========== 静态资源优化（JavaScript, CSS, 图片, 字体） ==========
location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    # 🔧 代理到 Docker 容器
    proxy_pass http://127.0.0.1:3001;
    
    # 🔧 使用 HTTP/1.1
    proxy_http_version 1.1;
    
    # 🔧 缓冲区配置
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    
    # 🔧 请求头传递
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 🆕 禁用范围请求（修复图片 HTTP/2 错误）
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    proxy_ignore_headers X-Accel-Buffering;
    
    # 🔧 浏览器缓存（1年）
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Accept-Ranges "none";
    
    # 🔧 CORS 支持（字体需要）
    add_header Access-Control-Allow-Origin "*" always;
}
